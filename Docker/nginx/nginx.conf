worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Edge-level throttle in front of the app-level Redis limiter — defense
    # in depth: this one survives even if the app tier is overwhelmed.
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=1r/s;

    # Hide backend implementation details.
    server_tokens off;

    upstream backend_api {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 30m;   # slightly above app-level 25MB upload cap, app enforces the real limit

        # Uncomment once certs are mounted:
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;
        # return 301 https://$host$request_uri;  # add to the :80 server once TLS is live

        location /api/v1/auth/login {
            limit_req zone=auth_zone burst=3 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=general_zone burst=20 nodelay;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /healthz {
            proxy_pass http://backend_api;
            access_log off;
        }

        location / {
            return 404;
        }
    }
}
