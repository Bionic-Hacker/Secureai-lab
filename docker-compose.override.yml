# Dev-only overlay. Docker Compose merges this with docker-compose.yml
# automatically â€” no flags needed.
#
# The Vite dev server runs here rather than on the host because Windows
# Application Control blocks Rollup's and esbuild's native binaries.

services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      # nginx inside the compose network, not localhost on the host.
      VITE_PROXY_TARGET: http://nginx:80
    volumes:
      - ./frontend:/app
      # Named volume so Linux-built node_modules never touches the Windows
      # filesystem. This is what keeps the two package trees from colliding.
      - frontend_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - nginx
    networks: [frontend_net]

volumes:
  frontend_modules:
