rules:
  # ---------------------------------------------------------------------
  # SQL Injection — string formatting / concatenation into SQL
  # ---------------------------------------------------------------------
  - id: sql-injection-fstring
    languages: [python]
    severity: ERROR
    message: >-
      SQL query built with an f-string or string concatenation. User input
      reaching this pattern allows SQL injection. Use a parameterized
      query instead — pass values via the driver's own parameter binding,
      never interpolate them into the query text.
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-89"
    patterns:
      - pattern-either:
          - pattern: $CONN.execute(f"...")
          - pattern: $CONN.execute("..." + $X)
          - pattern: $CONN.execute("...".format(...))

  - id: sql-injection-js-template
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      SQL query built with a template literal or string concatenation.
      Use a parameterized query / prepared statement instead.
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-89"
    patterns:
      - pattern-either:
          - pattern: $CONN.query(`...${$X}...`)
          - pattern: $CONN.query("..." + $X)

  # ---------------------------------------------------------------------
  # Cross-Site Scripting — unescaped output into HTML
  # ---------------------------------------------------------------------
  - id: xss-innerhtml-assignment
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Assigning to innerHTML with dynamic content can execute injected
      script if the value isn't sanitized. Prefer textContent for plain
      text, or an explicit sanitizer (e.g. DOMPurify) if HTML is required.
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-79"
    pattern: $EL.innerHTML = $X

  - id: xss-react-dangerously-set
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      dangerouslySetInnerHTML bypasses React's built-in escaping. Confirm
      the content is sanitized before this point, or use plain text
      rendering instead.
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-79"
    pattern: "dangerouslySetInnerHTML={{__html: $X}}"

  # ---------------------------------------------------------------------
  # Command Injection
  # ---------------------------------------------------------------------
  - id: command-injection-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      subprocess call with shell=True and a non-literal command allows
      shell metacharacters in input to be interpreted by the shell. Pass
      the command as a list and drop shell=True, or validate/allowlist
      input strictly if a shell is genuinely required.
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-78"
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: command-injection-node-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      child_process.exec() runs its argument through a shell. Use
      execFile() or spawn() with an argument array instead, which does
      not invoke a shell and isn't vulnerable to metacharacter injection.
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-78"
    pattern: child_process.exec($CMD, ...)

  # ---------------------------------------------------------------------
  # Hardcoded Credentials
  # ---------------------------------------------------------------------
  - id: hardcoded-password-assignment
    languages: [python, javascript, typescript]
    severity: ERROR
    message: >-
      A credential-like variable is assigned a literal string. Secrets
      belong in environment variables or a secrets manager, never
      committed as source code — this is exactly how a secret ends up
      permanently in git history even after being "removed" later.
    metadata:
      category: security
      owasp: "A07:2021 - Identification and Authentication Failures"
      cwe: "CWE-798"
    patterns:
      - pattern-either:
          - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|secret|api_key|apikey|access_token)\s*$
      - metavariable-regex:
          metavariable: $VAR
          regex: ^(?!.*(_TEST|_EXAMPLE|_PLACEHOLDER)).*$

  # ---------------------------------------------------------------------
  # Insecure Deserialization
  # ---------------------------------------------------------------------
  - id: insecure-deserialization-pickle
    languages: [python]
    severity: ERROR
    message: >-
      pickle.loads() on untrusted input allows arbitrary code execution —
      pickle's format includes instructions the interpreter executes
      during deserialization. Use a safe format (JSON) for any data that
      could originate outside your own process.
    metadata:
      category: security
      owasp: "A08:2021 - Software and Data Integrity Failures"
      cwe: "CWE-502"
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)

  - id: insecure-deserialization-yaml-load
    languages: [python]
    severity: ERROR
    message: >-
      yaml.load() without an explicit safe Loader can construct arbitrary
      Python objects from the input, including ones with side effects on
      construction. Use yaml.safe_load() instead.
    metadata:
      category: security
      owasp: "A08:2021 - Software and Data Integrity Failures"
      cwe: "CWE-502"
    pattern: yaml.load($X)

  # ---------------------------------------------------------------------
  # SSRF — outbound requests built from user-controlled input
  # ---------------------------------------------------------------------
  - id: ssrf-requests-user-url
    languages: [python]
    severity: WARNING
    message: >-
      An outbound HTTP request is made to a URL that appears to come from
      request input. Without an allowlist of permitted hosts, this lets a
      caller make your server issue requests to internal services or
      cloud metadata endpoints. Validate the target host against an
      allowlist before making the request.
    metadata:
      category: security
      owasp: "A10:2021 - Server-Side Request Forgery"
      cwe: "CWE-918"
    patterns:
      - pattern-either:
          - pattern: requests.get($URL, ...)
          - pattern: requests.post($URL, ...)
          - pattern: httpx.get($URL, ...)
      - metavariable-regex:
          metavariable: $URL
          regex: .*(request|req)\.(query|params|body|json)\[.*

  # ---------------------------------------------------------------------
  # Path Traversal
  # ---------------------------------------------------------------------
  - id: path-traversal-open
    languages: [python]
    severity: WARNING
    message: >-
      A file is opened using a path built from what looks like request
      input, without an apparent sanitization step. An attacker could
      supply "../" sequences to read or write outside the intended
      directory. Resolve the path and verify it stays within an expected
      base directory before use.
    metadata:
      category: security
      owasp: "A01:2021 - Broken Access Control"
      cwe: "CWE-22"
    patterns:
      - pattern: open($PATH, ...)
      - metavariable-regex:
          metavariable: $PATH
          regex: .*(request|req)\.(query|params|args)\[.*
