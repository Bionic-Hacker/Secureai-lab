# =============================================================================
# SecureAI Lab - local development stack
#
# Reconstructed from documentation/architecture/phase-1-architecture.md (S2
# component diagram, S5 container hardening), Docker/nginx/nginx.conf's
# `upstream backend:8000`, monitoring/prometheus/prometheus.yml's scrape
# target, and the service hostnames defaulted in backend/app/core/config.py
# (redis, clamav, vector-db). The original file was never committed.
#
#   docker compose up -d --build
#   docker compose run --rm backend alembic upgrade head
#   curl http://localhost:8080/healthz
# =============================================================================

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16-alpine
    <<: *hardening
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: secureai_lab
      POSTGRES_USER: ${POSTGRES_USER:-secureai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Loopback only - for local psql debugging, never exposed off-host.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secureai} -d secureai_lab"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend_net]

  redis:
    image: redis:7-alpine
    <<: *hardening
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend_net]

  clamav:
    image: clamav/clamav:1.5
    <<: *hardening
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      FRESHCLAM_CHECKS: "0"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5
    networks: [backend_net, frontend_net]

  vector-db:
    image: chromadb/chroma:0.5.5
    <<: *hardening
    environment:
      CHROMA_SERVER_AUTHN_CREDENTIALS: ${CHROMA_AUTH_TOKEN:?set CHROMA_AUTH_TOKEN in .env}
      CHROMA_SERVER_AUTHN_PROVIDER: chromadb.auth.token_authn.TokenAuthenticationServerProvider
    volumes:
      - chroma_data:/chroma/chroma
    networks: [backend_net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *hardening
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-secureai}:${POSTGRES_PASSWORD}@postgres:5432/secureai_lab
      REDIS_URL: redis://redis:6379/0
    # S5: the app has no business writing to its own filesystem outside
    # /data/uploads, which is a dedicated named volume.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend_net, frontend_net]

  nginx:
    image: nginx:1.27-alpine
    <<: *hardening
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    ports:
      - "8080:80"
    volumes:
      - ./Docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks: [frontend_net]

  prometheus:
    image: prom/prometheus:v2.54.1
    <<: *hardening
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    # Scrapes backend:8000/metrics over backend_net; never proxied by nginx.
    networks: [backend_net]

networks:
  # Internal: no route to the internet for the data-tier services. Bounds the
  # blast radius of a backend compromise (phase-1-architecture.md S2).
  backend_net:
    internal: true
  frontend_net:
    driver: bridge

volumes:
  pgdata:
  uploads:
  clamav_db:
  chroma_data:
  prom_data:
