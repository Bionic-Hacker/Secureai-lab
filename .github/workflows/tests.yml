name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: secureai_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependency for python-magic
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: |
          cd backend
          pip install --break-system-packages -r requirements-dev.txt

      - name: Run test suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/secureai_lab_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: c822289d88deb6fe88e24f3e44586b8bf66c6b376351d349fa9c723fc0e2c99d27cf4c06ce3e91d4d03b7291a34e3b80badf0b45507bd4c27203957d9384429b
          MFA_ENCRYPTION_KEY: 9WuOKe83cnWnkMtY0oWNuVE-8lHIaa6cy5oWRW9Fghs=
          FIELD_ENCRYPTION_KEY: 21eb814fefa0e4a895d407aa578f69a8a38d7247ba02d59bf8e903950c2ec236
        run: |
          cd backend
          pytest -v
